name: lifeos
description: A warm, offline-first personal AI growth companion.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  archive: ^4.0.9
  crypto: ^3.0.7
  cryptography: ^2.8.1
  cupertino_icons: ^1.0.8
  drift: ^2.34.2
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_markdown_plus: ^1.0.12
  flutter_riverpod: ^3.3.2
  flutter_secure_storage: ^10.3.1
  go_router: ^17.3.0
  http: ^1.6.0
  image: ^4.5.4
  image_picker: ^1.1.2
  path: ^1.9.1
  path_provider: ^2.1.5
  sqlite3: ^3.5.0
  uuid: ^4.5.2

dev_dependencies:
  build_runner: ^2.15.1
  drift_dev: ^2.34.5
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc
