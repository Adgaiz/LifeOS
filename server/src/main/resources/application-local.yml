spring:
  datasource:
    url: ${LIFEOS_DB_URL:jdbc:mysql://localhost:3306/lifeos?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${LIFEOS_DB_USERNAME:lifeos}
    password: ${LIFEOS_DB_PASSWORD:change-me}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  jpa:
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

logging:
  level:
    com.adgaiz.lifeos: DEBUG
